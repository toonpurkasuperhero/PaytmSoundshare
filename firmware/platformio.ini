; Paytm SoundShare Soundbox firmware
; Board : ESP32-S3-DevKitC-1 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM)
; Panels: env:s3_ili9488 (3.5" 480x320, default) | env:s3_ili9341 (2.8" 320x240)
;
;   pio run                       -> build both envs
;   pio run -e s3_ili9488 -t upload
;   pio run -e s3_ili9488 -t uploadfs   -> flashes firmware/data/ (clips) to LittleFS
;   pio device monitor

[platformio]
default_envs = s3_ili9488, s3_ili9341
data_dir = data

[env]
; espressif32 6.9.0 = Arduino-ESP32 2.0.17 (ESP-IDF 4.4.7)
platform = platformio/espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions_16MB_littlefs.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.2.7
    links2004/WebSockets@2.6.1
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.2.1
    ; Last ESP32-audioI2S release line that targets Arduino-ESP32 2.x (3.x needs core 3)
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; Uncomment when an INMP441 is wired to the second I2S port (see include/board_pins.h)
    ; -DHAS_MIC

[env:s3_ili9488]
build_flags =
    ${env.build_flags}
    -DPANEL_ILI9488

[env:s3_ili9341]
build_flags =
    ${env.build_flags}
    -DPANEL_ILI9341
